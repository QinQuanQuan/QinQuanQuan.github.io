<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Qinquanquan.com</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f8fa; color: #1f2328;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .bar { background: #30363d; }
  }
  .card {
    max-width: 480px; margin: 24px; padding: 56px 40px;
    background: #fff; border: 1px solid #d0d7de; border-radius: 12px;
    text-align: center; box-shadow: 0 8px 24px rgba(140,149,159,.12);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  p  { margin-top: 18px; font-size: 15px; line-height: 1.8; opacity: .7; }
  .bar {
    width: 64px; height: 4px; border-radius: 2px; background: #d0d7de;
    margin: 20px auto 0; opacity: .5;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Qinquanquan.com</h1>
    <p>网站建设中，敬请期待。</p>
    <div class="bar"></div>
  </main>
</body>
</html>
